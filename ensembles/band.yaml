# 编制 = 输入参数，不是代码里的常量（C1）
# 座位可以起别名（as:），同一件乐器可以坐两个人（节奏吉他 / 主音吉他）。

id: band
name: 待确认

seats:
  - {instrument: drum-kit}
  - {instrument: electric-bass}

  # 演奏者覆盖：这位长号手说 Ab2 也没问题（推荐值是 Bb2 起）
  - instrument: trombone
    overrides:
      comfort: [44, 65]

  - {instrument: piano}
  - {instrument: acoustic-guitar}

  # 同一件乐器，两个座位，两种功能
  - instrument: electric-guitar
    as: rhythm-guitar
    name: Rhythm Guitar
    overrides: {gm_program: 30}          # Distortion

  - instrument: electric-guitar
    as: lead-guitar
    name: Lead Guitar
    overrides: {gm_program: 29}          # Overdriven

  - {instrument: ewi}
  - {instrument: violin}
