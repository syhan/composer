# 编制从 ensembles/band.yaml 读入（C1：编制是输入，不是硬约束）
#
# 真实简谱（20 小节 = 5 句 × 4 小节）+ 4 小节引子 = 24 小节
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1 ----
#   5 3 5 1' - | 6 1' 5 | 5 1 2 3 2 1 | 2 -
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1
#   6 1' 1' | 7 6 7 1' | 6 7 1' 6 6 5 3 1 | 2
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1

ensemble: ../../ensembles/band.yaml

meta:
  title: "送别 / 史诗进行曲"
  version: v5
  tempo: 112
  division: 480
  grid: 16
  meter: [4, 4]

harmony:
  - {bar: 1,  name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 2,  name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 3,  name: Ab,  chord: [8, 0, 3],   bass: 8}
  - {bar: 4,  name: Bb,  chord: [10, 2, 5],  bass: 10}
  - {bar: 5,  name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 6,  name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 7,  name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 8,  name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 9,  name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 10, name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 11, name: F,   chord: [5, 9, 0],   bass: 5}
  - {bar: 12, name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 13, name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 14, name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 15, name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 16, name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 17, name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 18, name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 19, name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 20, name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 21, name: C,   chord: [0, 4, 7],   bass: 0}
  - {bar: 22, name: Am,  chord: [9, 0, 4],   bass: 9}
  - {bar: 23, name: G,   chord: [7, 11, 14], bass: 7}
  - {bar: 24, name: C5,  chord: [0, 7],      bass: 0}

presence:
  - {bars: "1-2",   parts: [Drum Kit]}
  - {bars: "3-4",   parts: [Drum Kit, Trombone, Piano]}
  - {bars: "5-8",   parts: [Drum Kit, Electric Bass, Trombone, Piano, Violin]}
  - {bars: "9-12",  parts: [Drum Kit, Electric Bass, Trombone, Piano, Violin, Acoustic Guitar]}
  - {bars: "13-16", parts: [Drum Kit, Electric Bass, Trombone, Piano, Violin, Acoustic Guitar, Rhythm Guitar]}
  - {bars: "17-22", parts: [Drum Kit, Electric Bass, Trombone, Piano, Violin, Acoustic Guitar, Rhythm Guitar, Lead Guitar, EWI]}
  - {bars: "23",    parts: [Drum Kit, Electric Bass, Violin]}
  - {bars: "24",    parts: [Drum Kit, Electric Bass, Trombone, Piano, Violin, Acoustic Guitar, Rhythm Guitar, Lead Guitar, EWI]}

dynamics:
  - {bars: "1-2",   level: 0.24}
  - {bars: "3-4",   level: 0.34}
  - {bars: "5-8",   level: 0.46}
  - {bars: "9-12",  level: 0.58}
  - {bars: "13-16", level: 0.70}
  - {bars: "17-20", level: 0.86}
  - {bars: "21-22", level: 1.00}
  - {bars: "23",    level: 0.42}
  - {bars: "24",    level: 1.00}

parts:
  - instrument: drum-kit
    segments:
      - {bars: "1",    pattern: {pitch: snare, rhythm: "x---x---x---x---"}, velocity: 58}
      - {bars: "2",    pattern: {pitch: snare, rhythm: "x-x-x-x-x-x-x-x-"}, velocity: 64}
      - {bars: "3",    pattern: {pitch: snare, rhythm: "xxxxxxxxxxxxxxxx"}, velocity: 70,
                        also: {pitch: kick, rhythm: "x-------x-------"}}
      - {bars: "4",    pattern: {pitch: snare, rhythm: "xxxxxxxxxxxxxxxx"}, velocity: 80,
                        also: {pitch: kick, rhythm: "x---x---x---x---"},
                        extra: {pitch: crash, rhythm: "x---------------"}}
      - {bars: "5-12", pattern: {pitch: kick,  rhythm: "x-------x-------"}, velocity: 92,
                        also: {pitch: snare, rhythm: "----x-------x---"},
                        extra: {pitch: hh, rhythm: "x-x-x-x-x-x-x-x-"}}
      - {bars: "13-15",pattern: {pitch: kick,  rhythm: "x-------x-------"}, velocity: 100,
                        also: {pitch: snare, rhythm: "----x------xx-x-"},
                        extra: {pitch: hh, rhythm: "x-x-x-x-x-x-x-x-"}}
      - {bars: "16",   pattern: {pitch: kick,  rhythm: "x-------x-------"}, velocity: 106,
                        also: {pitch: snare, rhythm: "----x---xxxx----"},
                        extra: {pitch: hh, rhythm: "x-x-x-x-x-x-x-x-"}}
      - {bars: "17-22",pattern: {pitch: crash, rhythm: "x---------------"}, velocity: 112,
                        also: {pitch: kick, rhythm: "x---x---x---x---"},
                        extra: {pitch: snare, rhythm: "----x-------x---"}}
      - {bars: "23",   pattern: {pitch: snare, rhythm: "x---x---x---x---"}, velocity: 50}
      - {bars: "24",   pattern: {pitch: crash, rhythm: "x---------------"}, velocity: 120,
                        also: {pitch: kick, rhythm: "x---------------"}}

  - instrument: electric-bass
    base_octave: 2
    segments:
      - {bars: "1-4",  rest: true}
      - {bars: "5-8",  pattern: {pitch: root, rhythm: "x-------x-------"}, velocity: 72}
      - {bars: "9-12", pattern: {pitch: root, rhythm: "x---x---x---x---"}, velocity: 78}
      - {bars: "13-22",pattern: {pitch: root, rhythm: "x-x-x-x-x-x-x-x-"}, velocity: 92}
      - {bars: "23",   pattern: {pitch: root, rhythm: "x---x---x---x---"}, velocity: 52}
      - {bars: "24",   pattern: {pitch: root, rhythm: "x---------------"}, velocity: 118,
                       also: {pitch: octave, rhythm: "x---------------"}}

  - instrument: trombone
    base_octave: 3
    place: auto
    segments:
      - {bars: "1-2",  rest: true}
      - {bars: "3-16", pattern: {pitch: nearest, rhythm: "x---------------"}, velocity: 66}
      - {bars: "17-22",pattern: {pitch: nearest, rhythm: "x---------------"}, velocity: 104, transpose: 12}
      - {bars: "23",   rest: true}
      - {bars: "24",   pattern: {pitch: root, rhythm: "x---------------"}, velocity: 118,
                       also: {pitch: fifth, rhythm: "x---------------"}}

  - instrument: piano
    base_octave: 4
    segments:
      - {bars: "1-2",  rest: true}
      - {bars: "3-16", pattern: {pitch: wide, rhythm: "x-------x-------"}, velocity: 70}
      - {bars: "17-22",pattern: {pitch: wide, rhythm: "x---------------"}, velocity: 100}
      - {bars: "23",   rest: true}
      - {bars: "24",   pattern: {pitch: wide, rhythm: "x---------------"}, velocity: 110}

  - instrument: acoustic-guitar
    base_octave: 4
    segments:
      - {bars: "1-8",  rest: true}
      - {bars: "9-16", pattern: {pitch: arp,   rhythm: "x-x-x-x-x-x-x-x-"}, velocity: 62}
      - {bars: "17-22",pattern: {pitch: chord, rhythm: "x-------x-------"}, velocity: 96}
      - {bars: "23",   rest: true}
      - {bars: "24",   pattern: {pitch: chord, rhythm: "x---------------"}, velocity: 104}

  - instrument: rhythm-guitar
    base_octave: 3
    segments:
      - {bars: "1-12", rest: true}
      - {bars: "13-16",pattern: {pitch: power, rhythm: "x-x-x-x-x-x-x-x-"}, velocity: 58}
      - {bars: "17-22",pattern: {pitch: power, rhythm: "x---------------"}, velocity: 100}
      - {bars: "23",   rest: true}
      - {bars: "24",   pattern: {pitch: power, rhythm: "x---------------"}, velocity: 112}

  - instrument: lead-guitar
    base_octave: 3
    segments:
      - {bars: "1-16", rest: true}
      - {bars: "17-22",melody_of: violin, unison: -12}   # 主题低八度加倍：C12 要的是齐奏
      - {bars: "23",   rest: true}
      - {bars: "24",   melody_of: violin, unison: -12}

  - instrument: ewi
    base_octave: 4
    segments:
      - {bars: "1-16", rest: true}
      - {bars: "17-22",melody_of: violin, unison: 0}
      - {bars: "23",   rest: true}
      - {bars: "24",   melody_of: violin, unison: 0}

  - instrument: violin
    base_octave: 4
    lead: true
    segments:
      - {bars: "1-4", rest: true}
      - {bars: "5",   degrees: "5:4 3:4 5:2 8:2 7:4"}
      - {bars: "6",   degrees: "6:4 8:4 5:8"}
      - {bars: "7",   degrees: "5:4 2:4 3:2 4:2 7,:4"}
      - {bars: "8",   degrees: "1:16"}
      - {bars: "9",   degrees: "5:4 3:4 5:4 8:4"}
      - {bars: "10",  degrees: "6:4 8:4 5:8"}
      - {bars: "11",  degrees: "5:4 1:2 2:2 3:2 2:2 1:4"}
      - {bars: "12",  degrees: "2:8"}
      - {bars: "13",  degrees: "5:4 3:4 5:2 8:2 7:4"}
      - {bars: "14",  degrees: "6:4 8:4 5:8"}
      - {bars: "15",  degrees: "5:4 2:4 3:2 4:2 7,:4"}
      - {bars: "16",  degrees: "1:16"}
      - {bars: "17",  degrees: "6:8 8:4 8:4"}
      - {bars: "18",  degrees: "7:4 6:4 7:4 8:4"}
      - {bars: "19",  degrees: "6:2 7:2 8:2 6:2 6:2 5:2 3:2 1:2"}
      - {bars: "20",  degrees: "2:16"}
      - {bars: "21",  degrees: "5:4 3:4 5:2 8:2 7:4"}
      - {bars: "22",  degrees: "6:4 8:4 5:8"}
      - {bars: "23",  degrees: "5:4 2:4 3:2 4:2 7,:4"}
      - {bars: "24",  degrees: "1:16"}
