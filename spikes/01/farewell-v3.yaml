# 编制从 ensembles/band.yaml 读入（C1：编制是输入，不是硬约束）
#
# 真实简谱（20 小节 = 5 句 × 4 小节）+ 4 小节引子 = 24 小节
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1 ----
#   5 3 5 1' - | 6 1' 5 | 5 1 2 3 2 1 | 2 -
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1
#   6 1' 1' | 7 6 7 1' | 6 7 1' 6 6 5 3 1 | 2
#   5 3 5 1' 7 | 6 1' 5 | 5 2 3 4 7, | 1

ensemble: ../../ensembles/band.yaml

meta:
  title: "送别 / 史诗进行曲"
  version: v4
  tempo: 112
  division: 480
  grid: 16
  meter: [4, 4]

# 纲要：给没听过的人。矩阵（在场表）是权威，句子是注释。
#
# 写作规则：一句旁白只有在能说出「否则你会听成什么」时才值得写。
# 说不出来的（「这里钢琴进来了」）要么归到 summary，要么删掉——矩阵已经说了。
#
# intension 是内涵级：对这份编曲和蒸汽机版**两份外延都成立**。
# 有一份不成立的，就不是内涵，是编曲细节。
guide:
  summary: 一个人唱，人一个一个跟上来，最后一小节砸下去。
  intension:
    - 主题第一次出现时只有一条线在唱它；加厚靠别的声部叠上来，不靠旋律自己变复杂。
    - 力量来自重复和逐层加厚，不来自新素材。
    - 最响的地方不是新材料，是把已经听过的东西再说一遍。
    - 结尾不能像剪辑点：要么砸住，要么淡到听不见，不能干脆切断。
  beats:
    - {bar: 1,  text: 只有鼓。别急着找旋律——它在等一个空档，不是在铺垫。}
    - {bar: 3,  text: 钢琴和长号先给出和声的底，还没有主题。别把这段听成"安静的前奏"，它是"还没到齐"。}
    - {bar: 5,  text: 主题第一次出现，一个人唱。伴奏已经在，但只有小提琴在唱它。}
    - {bar: 9,  text: 原声吉他进来，同一句。听句子有没有更满，别数乐器。}
    - {bar: 13, text: 节奏吉他进来。到这里"厚"靠的是人变多，不是音量变大。}
    - {bar: 17, text: 全员。注意 EWI 和小提琴是同度齐奏——不是两条线，是一张嘴在响。}
    - {bar: 21, text: 最响，但旋律是重复，不是新东西。}
    - {bar: 23, text: 突然只剩三件。这一小节是空的，不是弱的——它在给最后一小节腾地方。}
    - {bar: 24, text: 空五度砸下来。它结束在"还没完"上，不是结束在终止上。}

harmony:
